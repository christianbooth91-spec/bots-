<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Trench Verified — every pump.fun caller graded on real on-chain win rates. Self-updating, verified, no screenshots.">
<title>Trench Verified — graded caller leaderboard</title>
</head>
<body style="margin:0">
<title>Trench Verified</title>
<style>
:root{--bg:#0a0d14;--surface:#121722;--surface2:#1a2130;--line:#232c3d;--ink:#eef2f8;--ink2:#aab4c5;--mut:#6b7688;--ind:#818cf8;--pur:#c084fc;--grn:#34d399;--amb:#fbbf24;--red:#f87171}
*{box-sizing:border-box}body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ind);text-decoration:none}a:hover{text-decoration:underline}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 60px}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:6px}
.brand{font-size:23px;font-weight:800;letter-spacing:.02em;background:linear-gradient(90deg,var(--ind),var(--pur));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--ink2);font-size:13px;margin:2px 0 18px;max-width:680px}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:5px 11px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 7px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.stat .v{font-size:22px;font-weight:800}.stat .l{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.ctl input,.ctl select{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 12px;font-size:13px;outline:none}
.ctl input{flex:1;min-width:170px}.ctl input:focus,.ctl select:focus{border-color:var(--ind)}
.hint{color:var(--mut);font-size:11px;margin-bottom:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.rmain{display:grid;grid-template-columns:30px 1fr auto 42px;gap:12px;align-items:center;cursor:pointer}
.rank{font-weight:800;color:var(--mut);font-size:15px;text-align:center}
.who .nm{font-weight:700;font-size:15px}
.who .meta{color:var(--ink2);font-size:12px;margin-top:2px;display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pill{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:99px;border:1px solid}
.moon{color:var(--pur);border-color:#3a2d52;background:#1d1630}.snipe{color:var(--ind);border-color:#2a3358;background:#151a30}.other{color:var(--ink2);border-color:var(--line);background:var(--surface2)}
.st{display:inline-flex;align-items:center;gap:5px}.sd{width:7px;height:7px;border-radius:50%}
.metrics{display:flex;gap:15px;text-align:right}
.m{min-width:40px}.m .mv{font-weight:700;font-variant-numeric:tabular-nums}.m .ml{color:var(--mut);font-size:10px;text-transform:uppercase;letter-spacing:.05em}
.score{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;text-align:center}
.wr{display:flex;gap:3px;margin-top:6px;max-width:200px}
.wr .seg{height:5px;border-radius:3px;flex:1;background:var(--surface2);overflow:hidden}.wr .seg i{display:block;height:100%;border-radius:3px}
.coins{display:none;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap}
.row.open .coins{display:flex}
.coin{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-width:150px;flex:1}
.coin .cn{font-weight:700}.coin .cx{color:var(--grn);font-weight:800;font-variant-numeric:tabular-nums}.coin .cd{color:var(--ink2);font-size:12px;margin-top:2px}
.foot{color:var(--mut);font-size:12px;text-align:center;margin-top:26px;line-height:1.7}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.metrics{display:none}.rmain{grid-template-columns:26px 1fr 40px}}
</style>
<div class="wrap">
<div class="head"><div class="brand">TRENCH VERIFIED</div><div class="live"><span class="dot"></span><span id="upd">live</span></div></div>
<div class="sub">Every caller graded on their real win rate — win %, average multiple, best call and top coins. Grades recompute continuously from on-chain outcomes.</div>
<div class="stats" id="stats"></div>
<div class="ctl"><input id="q" placeholder="Search caller…" autocomplete="off"><select id="sort"><option value="caller_score">Sort: Score</option><option value="pct_5x">Sort: 5x win %</option><option value="pct_2x">Sort: 2x win %</option><option value="avg_mult">Sort: Avg multiple</option><option value="best_call">Sort: Best call</option><option value="calls">Sort: Calls</option></select><select id="fst"><option value="">All status</option><option value="Active">Active</option><option value="Cooling">Cooling</option><option value="Dormant">Dormant</option></select></div>
<div class="hint">Tap a caller to see their top coins · <span id="cnt"></span></div>
<div id="board"></div>
<div class="foot">TrenchScore · verified-caller leaderboard · not financial advice</div>
</div>
<script>
var DATA=__DATA__;
function kk(n){n=+n||0;return n>=1e6?'$'+(Math.round(n/1e5)/10)+'M':n>=1000?'$'+Math.round(n/1000)+'k':'$'+Math.round(n);}
function fol(n){n=+n||0;return n>=1000?(Math.round(n/100)/10)+'k':''+n;}
function ago(iso){var s=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/1000));return s<90?'just now':s<3600?Math.round(s/60)+'m ago':Math.round(s/3600)+'h ago';}
function arche(a){var c=/moon/i.test(a)?'moon':/sniper|sharp/i.test(a)?'snipe':'other';return '<span class="pill '+c+'">'+(a||'Caller')+'</span>';}
function stCol(s){return s==='Active'?'var(--grn)':s==='Cooling'?'var(--amb)':'var(--mut)';}
function scCol(v){v=+v||0;return v>=85?'var(--grn)':v>=70?'var(--ind)':v>=55?'var(--amb)':'var(--ink2)';}
function bar(p,c){p=Math.max(3,Math.min(100,+p||0));return '<span class="seg"><i style="width:'+p+'%;background:'+c+'"></i></span>';}
function row(c,rank){
  var who=c.x_username?'<a href="https://x.com/'+c.x_username+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">@'+c.x_username+'</a>':'<span style="color:var(--ink2)">'+c.username+'</span>';
  var meta=who+arche(c.archetype)+'<span class="st"><span class="sd" style="background:'+stCol(c.status)+'"></span>'+c.status+'</span>'+(c.followers?'<span style="color:var(--mut)">'+fol(c.followers)+' followers</span>':'');
  var wr='<div class="wr">'+bar(c.pct_2x,'var(--ind)')+bar(c.pct_5x,'var(--pur)')+bar(c.pct_10x,'var(--grn)')+'</div>';
  var mtr='<div class="metrics">'
    +'<div class="m"><div class="mv">'+c.calls+'</div><div class="ml">calls</div></div>'
    +'<div class="m"><div class="mv">'+Math.round(c.pct_2x)+'%</div><div class="ml">2x</div></div>'
    +'<div class="m"><div class="mv">'+Math.round(c.pct_5x)+'%</div><div class="ml">5x</div></div>'
    +'<div class="m"><div class="mv">'+(Math.round((+c.avg_mult||0)*10)/10)+'x</div><div class="ml">avg</div></div>'
    +'<div class="m"><div class="mv" style="color:var(--grn)">'+Math.round(c.best_call||0)+'x</div><div class="ml">best</div></div>'
    +'</div>';
  var coins=(c.top||[]).map(function(t){return '<div class="coin"><div><span class="cn">'+t.coin+'</span> <span class="cx">'+(Math.round((+t.multiple||0)*10)/10)+'x</span></div><div class="cd">'+kk(t.entry_mcap)+' → '+kk(t.peak_mcap)+(t.migrated?' · ✅ migrated':'')+'</div><a class="cd" href="https://pump.fun/coin/'+t.mint+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">pump.fun ↗</a></div>';}).join('');
  if(!coins)coins='<div class="hint">No graded coins yet.</div>';
  return '<div class="row" onclick="this.classList.toggle(\'open\')"><div class="rmain"><div class="rank">'+rank+'</div><div class="who"><div class="nm">'+(c.x_username||c.username)+'</div><div class="meta">'+meta+'</div>'+wr+'</div>'+mtr+'<div class="score" style="color:'+scCol(c.caller_score)+'">'+c.caller_score+'</div></div><div class="coins">'+coins+'</div></div>';
}
function stat(v,l){return '<div class="stat"><div class="v">'+v+'</div><div class="l">'+l+'</div></div>';}
function render(){
  document.getElementById('stats').innerHTML=stat(DATA.n,'Verified callers')+stat(DATA.active,'Active now')+stat(Math.round(DATA.best_call)+'x','Best call')+stat(DATA.callers.length?Math.round(DATA.callers.reduce(function(a,c){return a+(+c.pct_2x||0)},0)/DATA.callers.length)+'%':'—','Avg 2x rate');
  var q=(document.getElementById('q').value||'').toLowerCase(),sk=document.getElementById('sort').value,fs=document.getElementById('fst').value;
  var list=DATA.callers.filter(function(c){return(!fs||c.status===fs)&&(!q||(c.username+' '+(c.x_username||'')).toLowerCase().indexOf(q)>=0)});
  list.sort(function(a,b){return(+b[sk]||0)-(+a[sk]||0)});
  document.getElementById('cnt').textContent=list.length+' shown';
  document.getElementById('board').innerHTML=list.map(function(c,i){return row(c,i+1)}).join('');
}
['q','sort','fst'].forEach(function(id){document.getElementById(id).addEventListener('input',render)});
document.getElementById('upd').textContent='updated '+ago(DATA.updated);
render();
</script>



</body>
</html>
